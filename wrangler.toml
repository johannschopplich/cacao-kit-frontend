name = "cacao-kit"
main = "./.output/server/index.mjs"
workers_dev = false
compatibility_date = "2026-11-01"
compatibility_flags = ["nodejs_compat", "no_nodejs_compat_v2"]

[[routes]]
pattern = "cacao-kit.byjohann.dev"
custom_domain = true

[assets]
directory = "./.output/public"
not_found_handling = "none"
# Serves the prerendered `en/index.html` at `/en` instead of redirecting to `/en/`.
html_handling = "drop-trailing-slash"
binding = "ASSETS"

[vars]
NUXT_PUBLIC_SITE_URL = "https://cacao-kit.byjohann.dev"
